# Map HTTP Upgrade header to a connection value; only set "upgrade" for WebSocket requests.
map $http_upgrade $connection_upgrade {
    default   keep-alive;
    ~*websocket upgrade;
}

server {
    listen 80;
    server_name _;

    # Video upload route — large request bodies, stream to backend.
    location /api/videos/upload {
        proxy_pass http://backend/videos/upload;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout profile — slow upload routes
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;

        # Buffer profile — large request bodies, stream to backend
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 500m;
    }

    # API routes — fast responses, small buffers, short timeouts.
    # Response buffering ON: backend workers write to nginx buffer and are freed
    # immediately; nginx handles slow client delivery.
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Timeout profile — fast API routes
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffer profile — small responses
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;
        proxy_request_buffering off;
        client_max_body_size 1m;
    }

    # Public media delivery — videos and thumbnails served directly by nginx.
    # Range requests (seek/stream) are handled natively by the static file module.
    location /uploads/ {
        alias /var/www/uploads/;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options nosniff always;
        types {
            video/mp4    mp4;
            video/webm   webm;
            image/jpeg   jpg jpeg;
            image/png    png;
            image/gif    gif;
        }
        default_type application/octet-stream;
        expires 1h;
        access_log off;
    }

    # Backend-authorized media served via internal redirect.
    location /_protected_uploads/ {
        internal;
        alias /var/www/uploads/;
        add_header Accept-Ranges bytes;
        add_header X-Content-Type-Options nosniff always;
        types {
            video/mp4    mp4;
            video/webm   webm;
            image/jpeg   jpg jpeg;
            image/png    png;
            image/gif    gif;
        }
        default_type application/octet-stream;
        expires 1h;
        access_log off;
    }

    # Public avatar delivery.
    location /uploads/avatars/ {
        alias /var/www/uploads/avatars/;
        add_header X-Content-Type-Options nosniff always;
        types {
            image/jpeg   jpg jpeg;
            image/png    png;
            image/gif    gif;
        }
        default_type application/octet-stream;
        expires 1h;
        access_log off;
    }

    # Proxy Grafana dashboard requests (available when observe profile is active).
    # Uses a variable + resolver so nginx defers DNS lookup to request time.
    # This allows nginx to start even when grafana is not running (prod-only mode).
    location /grafana/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Grafana WebSocket support for live features
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Proxy frontend UI requests to Vite frontend container.
    location / {
        proxy_pass http://frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}