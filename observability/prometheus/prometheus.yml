global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: youtube_clone_api
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - nginx:80
        labels:
          environment: compose

  - job_name: backend
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - backend:8000
        labels:
          environment: compose

  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          environment: compose
